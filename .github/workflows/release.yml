name: test-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  seed-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build_seed.py
      - run: python tools/check_public_release.py
      - run: python -m unittest discover -s app/tests -q
        env:
          PYTHONPATH: app
      - run: node --check app/static/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: shared-content
          path: |
            app/seed
            app/images
          retention-days: 2

  package:
    needs: seed-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            id: macos-arm64
            executable: dist/醫技國考.app/Contents/MacOS/醫技國考
          - os: macos-15-intel
            id: macos-intel
            executable: dist/醫技國考.app/Contents/MacOS/醫技國考
          - os: windows-2025
            id: windows-x64
            executable: dist/醫技國考/醫技國考.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: shared-content
          path: app
      - run: python -m pip install "pyinstaller>=6.10,<7" "tzdata>=2025.2"
      - run: pyinstaller --noconfirm medtech-study.spec
      - run: python tools/smoke_release.py "${{ matrix.executable }}"
        if: runner.os != 'Windows'
      - run: python tools/smoke_release.py "${{ matrix.executable }}"
        if: runner.os == 'Windows'
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/醫技國考.app" "taiwan-medtech-study-${{ matrix.id }}.zip"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/醫技國考" -DestinationPath "taiwan-medtech-study-${{ matrix.id }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: taiwan-medtech-study-${{ matrix.id }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --title "醫技國考 $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
